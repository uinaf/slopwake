name: Slopwake

options:
  bundleIdPrefix: dev.uinaf
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

packages:
  SlopwakeCore:
    path: .

settings:
  base:
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

targets:
  Slopwake:
    type: application
    platform: macOS
    sources:
      - path: SlopwakeApp
    dependencies:
      - package: SlopwakeCore
        product: SlopwakeCore
      - sdk: IOKit.framework
      - sdk: ServiceManagement.framework
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: dev.uinaf.slopwake
        PRODUCT_NAME: slopwake
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: slopwake
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        ONLY_ACTIVE_ARCH: NO

  SlopwakeTests:
    type: bundle.unit-test
    platform: macOS
    hostApplication: Slopwake
    sources:
      - path: Tests/SlopwakeAppTests
    dependencies:
      - target: Slopwake
      - package: SlopwakeCore
        product: SlopwakeCore
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/slopwake.app/Contents/MacOS/slopwake"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.uinaf.slopwake.tests

schemes:
  Slopwake:
    build:
      targets:
        Slopwake: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SlopwakeTests
